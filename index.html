<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.submit">iSubmit · 作业提交</title>
<link rel="stylesheet" href="style.css">
<style>
  .deadline{font-size:13px;margin-top:6px}
  .deadline.late{color:var(--warn)}
  .drop{border:1.5px dashed #c9c1b0;border-radius:10px;padding:22px;text-align:center;cursor:pointer;
    color:var(--muted);transition:.15s;background:#fff}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-2);color:var(--accent)}
  .drop strong{color:var(--ink)}
  ul.files{list-style:none;padding:0;margin:10px 0 0}
  ul.files li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;margin-top:6px;font-size:14px;background:#fff}
  .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fsize{color:var(--muted);font-size:12px}
  .status{font-size:12px;min-width:56px;text-align:right}
  .status.ok{color:var(--accent)} .status.err{color:var(--err)}
  .rm{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
  .linkbox{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
  .linktip{font-size:14px;margin-bottom:8px}
  input[type=url]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;color:inherit}
  input[type=url]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .receipt{font-family:ui-monospace,Menlo,monospace;font-size:13px;margin-top:6px;color:var(--ink);white-space:pre-line}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>i<span>Submit</span></h1>
      <p data-i18n="app.subtitle">作业提交 · 文件只有老师能看到</p>
    </div>
    <div id="langs" class="langs"></div>
  </header>

  <div class="card">
    <div id="loading" class="loading"></div>

    <!-- 口令 -->
    <form id="codeForm" hidden novalidate>
      <label for="code" data-i18n="code.label"></label>
      <input id="code" type="password" autocomplete="off">
      <div class="hint" data-i18n="code.hint"></div>
      <button class="btn block" type="submit" data-i18n="btn.continue"></button>
      <div id="codeMsg" class="msg"></div>
    </form>

    <!-- 提交 -->
    <form id="form" hidden novalidate autocomplete="off">
      <label for="cls" data-i18n="f.class"></label>
      <select id="cls"></select>

      <label for="name" data-i18n="f.name"></label>
      <select id="name"></select>

      <label for="assignment" data-i18n="f.assignment"></label>
      <select id="assignment"></select>
      <div id="deadline" class="deadline"></div>

      <label data-i18n="f.files"></label>
      <div id="drop" class="drop" tabindex="0">
        <strong data-i18n="drop.click"></strong> <span data-i18n="drop.or"></span>
        <div id="limits" class="hint"></div>
      </div>
      <input id="picker" type="file" multiple hidden>
      <ul id="files" class="files"></ul>

      <div class="linkbox">
        <div class="linktip" data-i18n="link.tip"></div>
        <input id="link" type="url" data-i18n-ph="link.ph" autocomplete="off">
        <div class="hint" data-i18n="link.hint"></div>
      </div>

      <button id="submit" class="btn block" type="submit" data-i18n="btn.submit"></button>
      <div id="msg" class="msg"></div>
    </form>
  </div>

  <footer>
    <div data-i18n="footer"></div>
    <div style="margin-top:6px"><a class="source" href="https://github.com/MrWengKB/iSubmit" target="_blank" rel="noopener" data-i18n="footer.deploy">部署自己的iSubmit</a></div>
  </footer>
</main>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
const URL_ = window.ISUBMIT_URL || '';
const $ = id => document.getElementById(id);
const t = I18N.t;
let cfg = null, code = '', queue = [], busy = false;
let loadingState = {key:'loading'};

// 不在电脑上记住班级和名字（学校电脑共用、家里也可能有兄弟姐妹使用）。
// 提交口令只在当前标签页内暂存，关掉标签页就清除。
const store = {
  get(k){ try{ return JSON.parse(sessionStorage.getItem('isubmit-'+k)); }catch(_){ return null; } },
  set(k,v){ try{ sessionStorage.setItem('isubmit-'+k, JSON.stringify(v)); }catch(_){} },
};
// 清除旧版本留在电脑上的记录
try{ localStorage.removeItem('isubmit-me'); localStorage.removeItem('isubmit-code'); }catch(_){}

async function api(body){
  const r = await fetch(URL_, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  return r.json();
}
function fmtSize(b){ return b < 1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(1)+' MB'; }
function fmtShort(iso){ return I18N.fmtDate(iso,{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function fmtLong(iso){ return I18N.fmtDate(iso,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function opt(sel, value, text, disabled){ const o=document.createElement('option'); o.value=value; o.textContent=text; o.disabled=!!disabled; sel.appendChild(o); }
function div(cls, text){ const d=document.createElement('div'); d.className=cls; d.textContent=text; return d; }

// 提示框：保存「怎么画」，切换语言时重画
function showMsg(el, type, render){ el._r={type, render}; paintMsg(el); }
function paintMsg(el){
  if(!el._r){ el.className='msg'; el.replaceChildren(); return; }
  el.className='msg show '+el._r.type;
  el.replaceChildren(...[].concat(el._r.render()));
}
function hideMsg(el){ el._r=null; paintMsg(el); }

function setLoading(key, hintKey){ loadingState={key, hintKey}; $('loading').hidden=false; paintLoading(); }
function paintLoading(){
  const L=$('loading'); L.replaceChildren(t(loadingState.key));
  if(loadingState.hintKey) L.append(div('hint', t(loadingState.hintKey)));
}

async function load(tryCode){
  if(!URL_ || URL_.includes('在此粘贴')) return setLoading('e.notConfigured','e.notConfiguredHint');
  let res;
  try{ res = await api({action:'config', code:tryCode}); }
  catch(e){ return setLoading('e.connect'); }

  if(!res.ok && res.needsCode){
    $('loading').hidden=true; $('codeForm').hidden=false;
    if(res.error){ const raw=res.error; showMsg($('codeMsg'),'err',()=>I18N.server(raw)); }
    return;
  }
  if(!res.ok) return setLoading('e.load');

  cfg = res; code = tryCode || '';
  if(cfg.needsCode) store.set('code', code);
  $('codeForm').hidden=true; $('loading').hidden=true;
  if(!cfg.classes.length) return setLoading('e.noClasses');

  $('cls').onchange=()=>fillClass();
  $('assignment').onchange=showDeadline;
  if(cfg.allowedExt.length) $('picker').accept=cfg.allowedExt.map(e=>'.'+e).join(',');
  fillClasses(); fillClass(); showLimits();
  $('form').hidden=false;
}

function fillClasses(){
  const c=$('cls'), keep=c.value; c.innerHTML='';
  opt(c,'',t('sel.class'));
  cfg.classes.forEach(x=>opt(c,x.id,x.name));
  c.value=keep;
}

function fillClass(keepName, keepAssign){
  const cid=$('cls').value;
  const cls=cfg.classes.find(x=>x.id===cid);
  const n=$('name'), a=$('assignment');
  n.innerHTML=''; a.innerHTML='';
  if(!cls){ opt(n,'',t('sel.classFirst')); opt(a,'',t('sel.classFirst')); n.disabled=a.disabled=true; showDeadline(); return; }
  n.disabled=a.disabled=false;

  opt(n,'',t('sel.name'));
  cls.students.forEach(s=>opt(n,s,s));
  if(keepName && cls.students.includes(keepName)) n.value=keepName;

  const list=cfg.assignments.filter(x=>x.classIds.includes(cid));
  if(!list.length){ opt(a,'',t('sel.noAssign')); a.disabled=true; }
  list.forEach(x=>opt(a,x.id,x.name+(x.closed?t('sel.closed'):''),x.closed));
  if(keepAssign && list.some(x=>x.id===keepAssign && !x.closed)) a.value=keepAssign;
  else { const first=list.find(x=>!x.closed); if(first) a.value=first.id; }
  showDeadline();
}

function showDeadline(){
  const d=$('deadline');
  const a=cfg && cfg.assignments.find(x=>x.id===$('assignment').value);
  if(!a || !a.deadline){ d.textContent=''; d.className='deadline'; return; }
  const late=new Date()>new Date(a.deadline);
  d.className='deadline'+(late?' late':'');
  d.textContent=t('dl.label',{d:fmtLong(a.deadline)})+(late?(cfg.allowLate?t('dl.lateOk'):t('dl.closed')):'');
}

function showLimits(){
  $('limits').textContent=t('lim.size',{n:cfg.maxFileMB})+(cfg.allowedExt.length?t('lim.types',{list:cfg.allowedExt.join(', ')}):'');
}

function addFiles(list){
  hideMsg($('msg'));
  for(const f of list){
    const ext=(f.name.includes('.')?f.name.split('.').pop():'').toLowerCase();
    let err=null;
    if(cfg.allowedExt.length && !cfg.allowedExt.includes(ext)) err={key:'f.badType'};
    else if(f.size > cfg.maxFileMB*1048576) err={key:'f.tooBig', vars:{n:cfg.maxFileMB}};
    else if(!f.size) err={key:'f.empty'};
    const li=document.createElement('li');
    li.innerHTML='<span class="fname"></span><span class="fsize"></span><span class="status"></span><button type="button" class="rm">×</button>';
    li.querySelector('.fname').textContent=f.name;
    li.querySelector('.fsize').textContent=fmtSize(f.size);
    const item={file:f, el:li, bad:!!err, done:false, st:null};
    if(err) setStatus(item,'err',err.key,err.vars);
    li.querySelector('.rm').onclick=()=>{ if(busy) return; queue=queue.filter(q=>q!==item); li.remove(); };
    $('files').appendChild(li); queue.push(item);
  }
  paintFiles();
}
function setStatus(item, cls, key, vars){ item.st={cls,key,vars}; paintStatus(item); }
function paintStatus(item){
  const s=item.el.querySelector('.status');
  if(!item.st){ s.className='status'; s.textContent=''; return; }
  s.className='status '+item.st.cls; s.textContent=t(item.st.key,item.st.vars);
}
function paintFiles(){
  queue.forEach(item=>{ paintStatus(item); item.el.querySelector('.rm').title=t('f.remove'); });
}

function toBase64(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=()=>rej(new Error(t('e.readFile'))); r.readAsDataURL(file); });
}

async function submit(e){
  e.preventDefault();
  const msg=$('msg'); hideMsg(msg);
  const err=key=>showMsg(msg,'err',()=>t(key));
  const classId=$('cls').value, name=$('name').value, assignmentId=$('assignment').value;
  if(!classId) return err('sel.class');
  if(!name) return err('sel.name');
  if(!assignmentId) return err('v.pickAssign');
  const todo=queue.filter(q=>!q.bad && !q.done);
  const link=$('link').value.trim();
  if(link && !/^https?:\/\/\S+$/i.test(link)) return err('v.badLink');
  if(!todo.length && !link) return err(queue.length?'v.noValidFiles':'v.nothing');

  busy=true; $('submit').disabled=true; $('submit').textContent=t('btn.submitting');
  const receipts=[]; let failed=0, lastErr='';

  for(const item of todo){
    setStatus(item,'','st.uploading');
    try{
      const data=await toBase64(item.file);
      const res=await api({action:'submit', code, classId, name, assignmentId,
        file:{name:item.file.name, type:item.file.type, data}});
      if(!res.ok) throw new Error(res.error);
      item.done=true; setStatus(item,'ok','st.done');
      receipts.push({label:item.file.name, receipt:res.receipt, late:res.late});
    }catch(ex){
      failed++; setStatus(item,'err','st.failed'); lastErr=ex.message||'';
    }
  }
  if(link){
    try{
      const res=await api({action:'submit', code, classId, name, assignmentId, link});
      if(!res.ok) throw new Error(res.error);
      receipts.push({linkLabel:true, receipt:res.receipt, late:res.late});
      $('link').value='';
    }catch(ex){ failed++; lastErr=ex.message||''; }
  }
  busy=false; $('submit').disabled=false; $('submit').textContent=t('btn.submit');

  const at=new Date().toISOString();
  if(receipts.length){
    showMsg(msg, failed?'err':'ok', ()=>{
      const lines=receipts.map(r=>(r.linkLabel?t('r.link'):r.label)+'  '+t('r.receipt')+' '+r.receipt+(r.late?t('r.late'):''));
      lines.push(t('r.time')+' '+fmtShort(at));
      return [failed?t('r.partial'):t('r.ok'), div('receipt', lines.join('\n'))];
    });
  } else if(failed){
    showMsg(msg,'err',()=> lastErr ? I18N.server(lastErr) : t('e.network'));
  }
}

// 切换语言：重画所有动态内容
function relabel(){
  paintLoading();
  if(cfg && !$('form').hidden){
    const n=$('name').value, a=$('assignment').value;
    fillClasses(); fillClass(n,a); showLimits();
  }
  paintFiles();
  if(busy) $('submit').textContent=t('btn.submitting');
  paintMsg($('msg')); paintMsg($('codeMsg'));
}

const drop=$('drop'), picker=$('picker');
drop.onclick=()=>picker.click();
drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); picker.click(); } };
picker.onchange=()=>{ addFiles(picker.files); picker.value=''; };
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
$('form').addEventListener('submit',submit);
$('codeForm').addEventListener('submit',e=>{ e.preventDefault(); hideMsg($('codeMsg')); load($('code').value.trim()); });

I18N.mountSwitcher($('langs'), relabel);
I18N.apply();
paintLoading();
load(store.get('code')||'');
</script>
</body>
</html>
