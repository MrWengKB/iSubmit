<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="a.title">iSubmit · 管理</title>
<link rel="stylesheet" href="style.css">
<style>
  nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  nav.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .item{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;margin-bottom:12px}
  .item-head{display:flex;gap:10px;align-items:center}
  .item-head input{flex:1;font-weight:600}
  .count{font-size:13px;color:var(--muted)}
  .checks{display:flex;flex-wrap:wrap;gap:6px 0;margin-top:4px}
  .savebar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);margin-top:8px}
  .savebar .dirty{color:var(--warn);font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:20px;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{font-size:13px;color:var(--muted);font-weight:600}
  .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px}
  .tag.ok{background:var(--accent-2);color:var(--accent)}
  .tag.no{background:var(--err-2);color:var(--err)}
  .tag.link{background:#e8eef8;color:#2d4f86;text-decoration:none}
  .tag.late{background:#fbf0de;color:var(--warn)}
  .summary{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
  .summary b{font-size:20px}
  .links a{margin-right:14px;font-size:14px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toolbar select{width:auto;flex:1;min-width:200px}
  .class-block{margin-top:18px}
  .class-block h3{font-size:15px;margin:0;display:flex;justify-content:space-between;align-items:center}
</style>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<main class="wide">
  <header>
    <div>
      <h1>i<span>Submit</span> <span data-i18n="a.h1" style="color:inherit">管理</span></h1>
      <p data-i18n="a.subtitle"></p>
    </div>
    <div class="header-right">
      <div id="langs" class="langs"></div>
      <button id="logout" class="btn ghost small" hidden data-i18n="a.logout"></button>
    </div>
  </header>

  <div id="loading" class="card loading"></div>

  <!-- 首次设置 / 登录 -->
  <form id="auth" class="card" hidden novalidate style="max-width:460px">
    <h2 id="authTitle"></h2>
    <p id="authHint" class="hint"></p>
    <label for="pw" data-i18n="a.pw"></label>
    <input id="pw" type="password" autocomplete="current-password">
    <div id="pw2Wrap" hidden>
      <label for="pw2" data-i18n="a.pw2"></label>
      <input id="pw2" type="password" autocomplete="new-password">
    </div>
    <button class="btn block" type="submit" id="authBtn"></button>
    <div id="authMsg" class="msg"></div>
  </form>

  <!-- 主界面 -->
  <div id="app" hidden>
    <nav class="tabs">
      <button data-tab="subs" class="on" data-i18n="a.tab.subs"></button>
      <button data-tab="classes" data-i18n="a.tab.classes"></button>
      <button data-tab="assignments" data-i18n="a.tab.assign"></button>
      <button data-tab="settings" data-i18n="a.tab.settings"></button>
    </nav>

    <!-- 提交情况 -->
    <section id="tab-subs" class="card">
      <div class="toolbar">
        <select id="subAssign"></select>
        <button class="btn small" id="subRefresh" data-i18n="a.refresh"></button>
      </div>
      <div id="subBody"></div>
      <div class="links" id="links" style="margin-top:16px"></div>
    </section>

    <!-- 班级 -->
    <section id="tab-classes" class="card" hidden>
      <h2 data-i18n="a.classesTitle"></h2>
      <p class="hint" data-i18n="a.classesHint"></p>
      <div id="classList"></div>
      <button class="btn ghost small" id="addClass" data-i18n="a.addClass"></button>
    </section>

    <!-- 作业 -->
    <section id="tab-assignments" class="card" hidden>
      <h2 data-i18n="a.tab.assign"></h2>
      <p class="hint" data-i18n="a.assignHint"></p>
      <div id="assignList"></div>
      <button class="btn ghost small" id="addAssign" data-i18n="a.addAssign"></button>
    </section>

    <!-- 设置 -->
    <section id="tab-settings" class="card" hidden>
      <h2 data-i18n="a.settingsTitle"></h2>
      <label for="sCode" data-i18n="code.label"></label>
      <input id="sCode" type="text" data-i18n-ph="a.codePh">
      <div class="hint" data-i18n="a.codeHint"></div>

      <div class="row">
        <div>
          <label for="sMax" data-i18n="a.maxSize"></label>
          <input id="sMax" type="number" min="1" max="35">
          <div class="hint" data-i18n="a.max35"></div>
        </div>
        <div>
          <label data-i18n="a.afterDl"></label>
          <label class="inline" style="margin-top:10px"><input type="checkbox" id="sLate"> <span data-i18n="a.allowLate"></span></label>
        </div>
      </div>

      <label for="sExt" data-i18n="a.exts"></label>
      <input id="sExt" type="text" data-i18n-ph="a.extsPh">

      <h2 style="margin-top:28px" data-i18n="a.changePwTitle"></h2>
      <div class="row">
        <div><label for="np1" data-i18n="a.newPw"></label><input id="np1" type="password" autocomplete="new-password"></div>
        <div><label for="np2" data-i18n="a.pw2"></label><input id="np2" type="password" autocomplete="new-password"></div>
      </div>
      <button class="btn small" id="changePw" style="margin-top:12px" data-i18n="a.changePwBtn"></button>
      <div id="pwMsg" class="msg"></div>
    </section>

    <div class="savebar" id="savebar" hidden>
      <button class="btn" id="save" data-i18n="a.save"></button>
      <span id="dirty" class="dirty"></span>
      <span id="saveMsg" class="hint"></span>
    </div>
  </div>

  <footer><a class="source" href="https://github.com/MrWengKB/iSubmit" target="_blank" rel="noopener" data-i18n="footer.deploy">部署自己的iSubmit</a></footer>
</main>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
const URL_ = window.ISUBMIT_URL || '';
const $ = id => document.getElementById(id);
const t = I18N.t;
let password = '', data = null, meta = {}, dirty = false, tab = 'subs';
let setupMode = false, loadingKey = 'a.connecting', authErr = '', saveState = null, subsState = null;

async function api(body){
  const r = await fetch(URL_, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  return r.json();
}
async function adminApi(action, extra){
  const res = await api(Object.assign({action, password}, extra||{}));
  if(!res.ok && res.auth){ logout(res.error); throw new Error(res.error); }
  return res;
}
function el(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(k==='value') e.value=v;
    else if(k in e && typeof v!=='string') e[k]=v;
    else e.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c=>{ if(c!=null) e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}
function uid(){ return Math.random().toString(36).slice(2,10); }
// 提示框：保存「怎么画」，切换语言时重画
function showMsg(m, type, render){ m._r={type, render}; paintMsg(m); }
function paintMsg(m){
  if(!m._r){ m.className='msg'; m.textContent=''; return; }
  m.className='msg show '+m._r.type; m.textContent=m._r.render();
}
function hideMsg(m){ m._r=null; paintMsg(m); }
function toLocalInput(iso){ if(!iso) return ''; const d=new Date(iso); return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16); }
function fmt(iso){ return I18N.fmtDate(iso,{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function setDirty(v){ dirty=v; if(v) saveState=null; paintSave(); }
function paintSave(){
  $('dirty').textContent = dirty ? t('a.dirty') : '';
  const s=saveState;
  $('saveMsg').textContent = !s ? '' : s.key==='a.saved' ? t('a.saved',{t:I18N.fmtTime(s.at)})
    : s.key==='a.saveFailed' ? t('a.saveFailed',{msg:I18N.server(s.raw)}) : t(s.key);
}
window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

// ---------------- 登录 ----------------
function paintLoading(){ $('loading').textContent=t(loadingKey); }
async function start(){
  if(!URL_ || URL_.includes('在此粘贴')){ loadingKey='a.noConfig'; return paintLoading(); }
  let st;
  try{ st = await api({action:'adminStatus'}); }catch(e){ loadingKey='a.noConnect'; return paintLoading(); }
  $('loading').hidden=true;
  setupMode = !st.hasPassword;
  const saved = sessionStorage.getItem('isubmit-admin');
  if(!setupMode && saved){ password=saved; if(await enter()) return; }
  showAuth();
}
function showAuth(errRaw){
  $('app').hidden=true; $('logout').hidden=true; $('auth').hidden=false;
  authErr = errRaw || '';
  paintAuth();
  $('pw').focus();
}
function paintAuth(){
  $('authTitle').textContent = t(setupMode ? 'a.setupTitle' : 'a.login');
  $('authHint').textContent = setupMode ? t('a.setupHint') : '';
  $('authBtn').textContent = t(setupMode ? 'a.setupBtn' : 'a.login');
  $('pw2Wrap').hidden = !setupMode;
  $('pw').autocomplete = setupMode ? 'new-password' : 'current-password';
  if(authErr){ const raw=authErr; showMsg($('authMsg'),'err',()=>I18N.server(raw)); }
  else paintMsg($('authMsg'));
}
$('auth').addEventListener('submit', async e=>{
  e.preventDefault(); authErr=''; hideMsg($('authMsg'));
  const err=key=>showMsg($('authMsg'),'err',()=>t(key));
  const pw=$('pw').value;
  if(setupMode){
    if(pw.length<6) return err('pw.min');
    if(pw!==$('pw2').value) return err('a.pwMismatch');
    const r = await api({action:'adminSetup', password:pw});
    if(!r.ok){ const raw=r.error; return showMsg($('authMsg'),'err',()=>I18N.server(raw)); }
    setupMode=false;
  }
  password=pw;
  $('authBtn').disabled=true;
  await enter();
  $('authBtn').disabled=false;
});
async function enter(){
  let r;
  try{ r = await adminApi('adminGet'); }catch(e){ return false; }
  sessionStorage.setItem('isubmit-admin', password);
  data=r.data; meta={rootUrl:r.rootUrl, sheetUrl:r.sheetUrl};
  $('auth').hidden=true; $('app').hidden=false; $('logout').hidden=false; $('pw').value=''; $('pw2').value='';
  renderAll(); setDirty(false); switchTab(tab);
  return true;
}
function logout(msg){
  password=''; sessionStorage.removeItem('isubmit-admin');
  setDirty(false); showAuth(msg);
}
$('logout').onclick=()=>logout();

// ---------------- 标签页 ----------------
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function switchTab(tb){
  tab=tb;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tb));
  ['subs','classes','assignments','settings'].forEach(x=>$('tab-'+x).hidden = x!==tb);
  $('savebar').hidden = tb==='subs';
  if(tb==='subs'){ buildSubsSelect(); loadSubs(); }
}

function renderAll(){ renderClasses(); renderAssignments(); renderSettings(); }

// ---------------- 班级 ----------------
function renderClasses(){
  const box=$('classList'); box.innerHTML='';
  if(!data.classes.length) box.append(el('div',{class:'empty'},t('a.noClasses')));
  data.classes.forEach(c=>{
    const count=el('span',{class:'count'});
    const upd=()=>{ count.textContent=t('a.nStudents',{n:c.students.length}); };
    const ta=el('textarea',{placeholder:t('a.studentPh'), value:c.students.join('\n'),
      oninput:e=>{ c.students=e.target.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean); upd(); setDirty(true); }});
    upd();
    box.append(el('div',{class:'item'},
      el('div',{class:'item-head'},
        el('input',{type:'text', value:c.name, placeholder:t('a.classPh'), oninput:e=>{c.name=e.target.value; setDirty(true);}}),
        count,
        el('button',{class:'btn danger', type:'button', onclick:()=>{
          if(!confirm(t('a.confirmDelClass',{name:c.name||t('a.unnamed')}))) return;
          data.classes=data.classes.filter(x=>x!==c);
          data.assignments.forEach(a=>a.classIds=a.classIds.filter(id=>id!==c.id));
          renderAll(); setDirty(true);
        }},t('a.delete'))),
      el('label',{},t('a.studentList')), ta));
  });
}
$('addClass').onclick=()=>{
  data.classes.push({id:uid(), name:'', students:[]});
  renderClasses(); renderAssignments(); setDirty(true);
  const inputs=$('classList').querySelectorAll('.item-head input'); inputs[inputs.length-1].focus();
};

// ---------------- 作业 ----------------
function renderAssignments(){
  const box=$('assignList'); box.innerHTML='';
  if(!data.assignments.length) box.append(el('div',{class:'empty'},t('a.noAssign')));
  data.assignments.forEach(a=>{
    const checks=el('div',{class:'checks'});
    if(!data.classes.length) checks.append(el('span',{class:'hint'},t('a.addClassFirst')));
    data.classes.forEach(c=>{
      checks.append(el('label',{class:'inline'},
        el('input',{type:'checkbox', checked:a.classIds.includes(c.id), onchange:e=>{
          a.classIds = e.target.checked ? [...a.classIds, c.id] : a.classIds.filter(x=>x!==c.id); setDirty(true);
        }}), c.name||t('a.unnamedClass')));
    });
    box.append(el('div',{class:'item'},
      el('div',{class:'item-head'},
        el('input',{type:'text', value:a.name, placeholder:t('a.assignPh'), oninput:e=>{a.name=e.target.value; setDirty(true);}}),
        el('button',{class:'btn danger', type:'button', onclick:()=>{
          if(!confirm(t('a.confirmDelAssign',{name:a.name||t('a.unnamed')}))) return;
          data.assignments=data.assignments.filter(x=>x!==a); renderAssignments(); setDirty(true);
        }},t('a.delete'))),
      el('div',{class:'row'},
        el('div',{},
          el('label',{},t('a.deadline')),
          el('input',{type:'datetime-local', value:toLocalInput(a.deadline), onchange:e=>{
            a.deadline = e.target.value ? new Date(e.target.value).toISOString() : ''; setDirty(true);
          }})),
        el('div',{},
          el('label',{},t('a.status')),
          el('label',{class:'inline', style:'margin-top:10px'},
            el('input',{type:'checkbox', checked:a.open, onchange:e=>{a.open=e.target.checked; setDirty(true);}}),t('a.open')))),
      el('label',{},t('a.classesToSubmit')), checks));
  });
}
$('addAssign').onclick=()=>{
  data.assignments.unshift({id:uid(), name:'', classIds:data.classes.map(c=>c.id), deadline:'', open:true});
  renderAssignments(); setDirty(true);
  $('assignList').querySelector('.item-head input').focus();
};

// ---------------- 设置 ----------------
function renderSettings(){
  const s=data.settings;
  $('sCode').value=s.accessCode; $('sMax').value=s.maxFileMB; $('sLate').checked=s.allowLate;
  $('sExt').value=s.allowedExt.join(', ');
}
$('sCode').oninput=e=>{ data.settings.accessCode=e.target.value.trim(); setDirty(true); };
$('sMax').oninput=e=>{ data.settings.maxFileMB=Number(e.target.value)||20; setDirty(true); };
$('sLate').onchange=e=>{ data.settings.allowLate=e.target.checked; setDirty(true); };
$('sExt').oninput=e=>{ data.settings.allowedExt=e.target.value.split(/[,，\s]+/).map(x=>x.replace(/^\./,'').toLowerCase()).filter(Boolean); setDirty(true); };

$('changePw').onclick=async()=>{
  const m=$('pwMsg'); hideMsg(m);
  const a=$('np1').value, b=$('np2').value;
  if(a.length<6) return showMsg(m,'err',()=>t('pw.min'));
  if(a!==b) return showMsg(m,'err',()=>t('a.pwMismatch'));
  try{
    const r=await adminApi('adminPassword',{newPassword:a});
    if(!r.ok){ const raw=r.error; return showMsg(m,'err',()=>I18N.server(raw)); }
    password=a; sessionStorage.setItem('isubmit-admin',a);
    $('np1').value=$('np2').value=''; showMsg(m,'ok',()=>t('a.pwChanged'));
  }catch(_){}
};

// ---------------- 保存 ----------------
function validate(){
  for(const c of data.classes){
    if(!c.name.trim()) return t('a.v.className');
    const dup=c.students.find((s,i)=>c.students.indexOf(s)!==i);
    if(dup) return t('a.v.dupStudent',{c:c.name,n:dup});
  }
  const names=data.classes.map(c=>c.name.trim());
  const dupC=names.find((n,i)=>names.indexOf(n)!==i);
  if(dupC) return t('a.v.dupClass',{c:dupC});
  for(const a of data.assignments){
    if(!a.name.trim()) return t('a.v.assignName');
    if(a.open && !a.classIds.length) return t('a.v.assignNoClass',{a:a.name});
  }
  return '';
}
$('save').onclick=async()=>{
  const err=validate();
  if(err){ saveState=null; paintSave(); alert(err); return; }
  $('save').disabled=true; saveState={key:'a.saving'}; paintSave();
  try{
    const r=await adminApi('adminSave',{data});
    if(!r.ok){ saveState=null; paintSave(); alert(I18N.server(r.error)); return; }
    data=r.data; renderAll(); setDirty(false);
    saveState={key:'a.saved', at:new Date()}; paintSave();
  }catch(e){ saveState={key:'a.saveFailed', raw:e.message}; paintSave(); }
  finally{ $('save').disabled=false; }
};

// ---------------- 提交情况 ----------------
function buildSubsSelect(){
  const sel=$('subAssign'); const prev=sel.value; sel.innerHTML='';
  // 每个「班级 / 作业」组合一个选项，按班级排列
  const pairs=[];
  data.classes.forEach(c=>data.assignments.forEach(a=>{ if(a.classIds.includes(c.id)) pairs.push({c,a}); }));
  if(!pairs.length){
    sel.append(el('option',{value:''},t('a.noAssignOpt'))); sel.disabled=true;
  } else {
    sel.disabled=false;
    pairs.forEach(({c,a})=>sel.append(el('option',{value:c.id+'|'+a.id},
      (c.name||t('a.unnamedClass'))+' / '+(a.name||t('a.unnamed'))+(a.open?'':t('a.closedSuffix')))));
    if(pairs.some(({c,a})=>c.id+'|'+a.id===prev)) sel.value=prev;
  }
  const L=$('links'); L.innerHTML='';
  if(meta.rootUrl) L.append(el('a',{href:meta.rootUrl,target:'_blank',rel:'noopener'},t('a.openRoot')));
  if(meta.sheetUrl) L.append(el('a',{href:meta.sheetUrl,target:'_blank',rel:'noopener'},t('a.openSheet')));
}
$('subAssign').onchange=loadSubs;
$('subRefresh').onclick=loadSubs;

async function loadSubs(){
  const val=$('subAssign').value;
  if(!val){ subsState={kind:'none'}; return paintSubs(); }
  const [cid, id]=val.split('|');
  subsState={kind:'loading'}; paintSubs();
  let r;
  try{ r=await adminApi('adminSubmissions',{assignmentId:id}); }catch(e){ return; }
  if($('subAssign').value!==val) return;   // 用户已切换到别的选项
  if(r.ok) r.classes=r.classes.filter(c=>c.id===cid);   // 只显示选中的班级
  subsState = r.ok ? {kind:'data', r} : {kind:'err', raw:r.error};
  paintSubs();
}

function paintSubs(){
  const body=$('subBody'); body.innerHTML='';
  const s=subsState;
  if(!s) return;
  if(s.kind==='none') return body.append(el('div',{class:'empty'},t('a.addAssignFirst')));
  if(s.kind==='loading') return body.append(el('div',{class:'loading'},t('loading')));
  if(s.kind==='err') return body.append(el('div',{class:'empty'}, s.raw==='作业不存在' ? t('a.notSaved') : I18N.server(s.raw)));

  const r=s.r;
  let total=0, done=0;
  r.classes.forEach(c=>c.students.forEach(st=>{ total++; if(st.count) done++; }));
  body.append(el('div',{class:'summary'},
    el('span',{}, el('b',{},String(done)), t('a.submittedOf',{total})),
    r.assignment.deadline ? el('span',{class:'hint'},t('a.dueShort',{d:fmt(r.assignment.deadline)})) : null));
  if(!r.classes.length) body.append(el('div',{class:'empty'},t('a.noClassTicked')));

  r.classes.forEach(c=>{
    const missing=c.students.filter(st=>!st.count).map(st=>st.name);
    const tbody=el('tbody');
    c.students.forEach(st=>tbody.append(el('tr',{},
      el('td',{},st.name),
      el('td',{}, st.count ? el('span',{class:'tag ok'},t('a.submitted')+(st.count>1?' '+t('a.nCopies',{n:st.count}):'')) : el('span',{class:'tag no'},t('a.missing')),
        st.late ? ' ' : null, st.late ? el('span',{class:'tag late'},t('a.late')) : null,
        (st.links||[]).map((u,i)=>[' ', el('a',{href:u,target:'_blank',rel:'noopener noreferrer',class:'tag link',title:u},t('a.link')+((st.links.length>1)?(i+1):'')+' ↗')])),
      el('td',{class:'hint'}, fmt(st.last)))));
    body.append(el('div',{class:'class-block'},
      el('h3',{}, el('span',{}, c.name+'　',el('span',{class:'count'},(c.students.length-missing.length)+' / '+c.students.length),
          c.folderUrl ? ['　', el('a',{href:c.folderUrl,target:'_blank',rel:'noopener',style:'font-size:13px;font-weight:400'},t('a.openFolder'))] : null),
        missing.length ? el('button',{class:'btn ghost small',type:'button',onclick:async ev=>{
          const txt=t('a.missingText',{c:c.name,n:missing.length,names:I18N.list(missing)});
          try{ await navigator.clipboard.writeText(txt); ev.target.textContent=t('a.copied'); }catch(_){ prompt(t('a.copyPrompt'),txt); }
        }},t('a.copyMissing')) : null),
      c.students.length ? el('table',{}, el('thead',{},el('tr',{},el('th',{},t('f.name')),el('th',{},t('a.status')),el('th',{},t('a.lastSubmit')))), tbody)
        : el('div',{class:'empty'},t('a.emptyRoster'))));
  });
}

// 切换语言：重画所有动态内容（不会丢失未保存的修改）
function relabel(){
  paintLoading();
  if(!$('auth').hidden) paintAuth();
  if(!$('app').hidden){
    renderClasses(); renderAssignments();
    buildSubsSelect(); paintSubs(); paintSave(); paintMsg($('pwMsg'));
  }
}

I18N.mountSwitcher($('langs'), relabel);
I18N.apply();
paintLoading();
start();
</script>
